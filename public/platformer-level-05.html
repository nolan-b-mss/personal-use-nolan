<!DOCTYPE html> 
<html>
<head>
<title>platformer-level-05.html</title>
<style>
.yellow {color:yellow;}
.white {color:white;}
.blend {background-color:black;color:white;border-color:black;}
.bullet-sprite { width: 32px; height: 32px; }
@font-face { font-family: 'DeterminationMono'; src: url('font/DeterminationMonoWebRegular-Z5oq.ttf') format('truetype'); }
body {height:100vh;
      margin: 0; 
      background-color:black;
      position: relative; 
      font-family: 'DeterminationMono', monospace; }
#gameContainer {
    width: 1050px; 
    position: absolute; 
    left: 400px; 
    display: flex; 
    flex-direction: column;
    box-sizing: border-box;
}
#hp-section {
    display: flex; 
    align-items: center; 
    color: white; 
    font-family: 'Determination Mono', monospace; 
    margin-top: 0px;
}
#hp-display-group { 
    display: flex; 
    flex-direction: column; 
    align-items: flex-start; 
    margin-left: 30px;
}
#hp-container { 
    width: 150px; 
    height: 16px; 
    background-color: #c00; 
    margin-top: 8px;
}
#hp-bar { 
    width: 100%; 
    height: 100%; 
    background-color: #ffff00;
}
#hp-text {
    font-size:48px;
    font-family: 'DeterminationMono', monospace;
}
</style>
</head>
<body style="background-color:black; position: relative; overflow: hidden;">
<div id="tutorialScreen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: black; z-index: 2000; display: none; justify-content: center; align-items: center;">
    <img src="sprites/tutorial.jpg" style="max-width: 100%; max-height: 100%;">
</div>
<div id="debug" style="position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: lime; font-family: monospace; padding: 10px; border: 1px solid lime; z-index: 1000; font-size: 14px; pointer-events: none;">
</div>
<div id="bossHealthBarContainer" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 400px; height: 24px; background: rgba(0,0,0,0.8); z-index: 1000; padding: 2px;">
    <div id="bossName" style="color: white; font-size: 20px; text-align: center; position: absolute; width: 100%; z-index: 1001; line-height: 20px;">BOSS HP: <span id="hpText">100</span></div>
    <div id="bossHealthFill" style="width: 100%; height: 100%; background: #FF0055;"></div>
</div>
<div id="gameContainer">
<div id="hp-section"> 
    <div id="hp-display-group">
        <div id="hp-text-wrapper">
            <div style="font-size:48px;font-family: 'DeterminationMono', monospace;">HP:<span id="hp-text">5</span></div>
            
        </div>
        <div id="hp-container">
        <div id="hp-bar"></div>
        </div>
    </div>
</div>
<img src="sprites/soul-04.png" width="32" height="32" id="myPlayer01" style="position: absolute; left: 284px; top: 134px; opacity: 1.0; z-index: 100;">
</div>
<script>
const platforms = [
  //keep
    { left: -8, top: 900, width: 1114, height: 8},
    { left: -8, top: 0, width: 8, height: 900},
    { left: 1098, top: 0, width: 8, height: 900},
    { left: 225, top:800, width: 200, height: 8 },
    { left: 725, top:800, width: 200, height: 8 },
    { left: 475, top:700, width: 200, height: 8 },
];
const redPlatforms = [
];
const orangePlatforms = [
];
const bluePlatforms = [
];
const greenPlatforms = [
      { left: 564, top: 648, width: 32, height: 32 },
];
const checkpoints = [
];
const playerSize = 32;
let enemyContainer = document.getElementById('enemyContainer');
let gameContainer = document.getElementById('gameContainer');
let playerElement = document.getElementById('myPlayer01');
let maxHoriz;
let maxVerti;
let showDebug = false;
let mySpawnX = 525
let mySpawnY = 830
let myHoriz = 525
let myVerti = 830
let myCursorX;
let myCursorY;
let prevHoriz;
let prevVerti;
let isMoving = false;
let up = false;
let down = false;
let right = false;
let left = false;
let velocityY = 0;
const gravity = 0.2;
const jumpStrength = 8;
let playerHealth = 5;
let maxHealth = 5;
let isInvincible = false;
let isTrueInvincible = false;
let isGrounded = false;
let wKeyDebounced = false;
let sKeyDebounced = false;
let aKeyDebounced = false;
let dKeyDebounced = false;
let actionKeyPressed = false;
let tutorialOnScreen = false;
let goingToNextLevel = false;
let containerRect = gameContainer.getBoundingClientRect();
let randomAttackNumber;
let currentAttackInterval;
let actualTop;
let bossStarted = false;
let bossHealth = 100;
let bossMaxHealth = 100;
let bullets1 = [];
let bullets2 = [];
let bullets3 = [];
let bullets4 = [];
let bullets5 = [];
let bullets6 = [];

document.addEventListener('mousemove', (event) => {
    myCursorX = Math.round(event.clientX - containerRect.left);
    myCursorY = Math.round(event.clientY - containerRect.top);
});

function setupPlatform(p, color) {
    let plat = document.createElement('div');
    plat.style.position = 'absolute';
    plat.style.left = p.left + 'px';
    plat.style.top = p.top + 'px';
    plat.style.width = p.width + 'px';
    plat.style.height = p.height + 'px';
    plat.style.backgroundColor = color;
    
    if (p.minX !== undefined && p.maxX !== undefined) {
        plat.minX = p.minX;
        plat.maxX = p.maxX;
        plat.direction = p.direction || 1;
        plat.speed = p.speed || 2;
    }
    
    gameContainer.appendChild(plat);
    p.element = plat;
}

platforms.forEach(p => setupPlatform(p, 'white'));
redPlatforms.forEach(rp => setupPlatform(rp, 'red'));
orangePlatforms.forEach(op => setupPlatform(op, '#F75F00'));
bluePlatforms.forEach(bp => setupPlatform(bp, '#0098F7'));
greenPlatforms.forEach(gp => setupPlatform(gp, '#00FF00'));

checkpoints.forEach(c => {
    let checkpoint = document.createElement('div');
    checkpoint.style.position = 'absolute';
    checkpoint.style.left = c.left + 'px';
    checkpoint.style.top = c.top + 'px';
    checkpoint.style.width = c.width + 'px';
    checkpoint.style.height = c.height + 'px';
    checkpoint.style.backgroundImage = "url('sprites/checkpoint.gif')";
    checkpoint.style.backgroundSize = 'cover';
    gameContainer.appendChild(checkpoint);
});

document.onkeydown = function(event){
    if (event.key === "w" || event.key === "W" || event.key === "ArrowUp"){ up = true; }
    if (event.key === "s" || event.key === "S" || event.key === "ArrowDown"){ down = true; }
    if (event.key === "a" || event.key === "A" || event.key === "ArrowLeft"){ left = true; }
    if (event.key === "d" || event.key === "D" || event.key === "ArrowRight"){ right = true; }
    if (event.ctrlKey && event.key === "q"){
        showDebug = !showDebug;
        const debugElement = document.getElementById('debug');
        if (showDebug) { debugElement.style.display = 'block'; } 
        else { debugElement.style.display = 'none'; }
    }
    if (event.key === " "){
        const myTutorialScreen = document.getElementById('tutorialScreen')
        myTutorialScreen.style.display = 'none';
        tutorialOnScreen = false;
    }    
    if (event.key === "r" || event.key === "R"){
        myHoriz = mySpawnX;
        myVerti = mySpawnY;
    }
}

document.onkeyup = function(event){
    if (event.key === "w" || event.key === "W" || event.key === "ArrowUp"){ up = false; wKeyDebounced = false; }
    if (event.key === "s" || event.key === "S" || event.key === "ArrowDown"){ down = false; }
    if (event.key === "a" || event.key === "A" || event.key === "ArrowLeft"){ left = false; }
    if (event.key === "d" || event.key === "D" || event.key === "ArrowRight"){ right = false; }
}

function updateMovingPlatforms(platformList) {
    platformList.forEach(bp => {
        if (bp.minX !== undefined && bp.maxX !== undefined) {
            if (bp.left >= bp.maxX) {
                bp.left = bp.maxX;
                bp.direction = -1;
            }
            if (bp.left <= bp.minX) {
                bp.left = bp.minX;
                bp.direction = 1;
            }
            bp.left += bp.speed * bp.direction;
            bp.element.style.left = bp.left + 'px';
        }
    });
}

function movement() {
updateDebug();
if (!tutorialOnScreen){
prevHoriz = myHoriz; 
prevVerti = myVerti;

if (up && !wKeyDebounced && isGrounded) { velocityY = -jumpStrength; wKeyDebounced = true;}
isGrounded = false;

if (left) { myHoriz -= 3; }
if (right) { myHoriz += 3; }

velocityY += gravity;
myVerti += velocityY;

updateMovingPlatforms(platforms);
updateMovingPlatforms(redPlatforms);
updateMovingPlatforms(orangePlatforms);
updateMovingPlatforms(bluePlatforms);
updateMovingPlatforms(greenPlatforms);

platforms.forEach(p => {
let isVerticallyOverlapping = (myVerti + playerSize > p.top) && (myVerti < p.top + p.height);
if (isVerticallyOverlapping) {
if (p.width < 50 && p.height > 50) {
if (right && prevHoriz + playerSize <= p.left && myHoriz + playerSize > p.left) {
myHoriz = p.left - playerSize;
}
else if (left && prevHoriz >= p.left + p.width && myHoriz < p.left + p.width) {
myHoriz = p.left + p.width;
}
}
}
if (p.height === 8) {
if (((myVerti + playerSize) >= p.top) && velocityY >= 0 && (prevVerti + playerSize) <= p.top && myHoriz < (p.left + p.width) && (myHoriz + playerSize) > p.left) {
velocityY = 0;
isGrounded = true;
myVerti = p.top - playerSize;
}
if (myVerti >= p.top && velocityY > 0 && prevVerti < p.top && myHoriz < (p.left + p.width) && (myHoriz + playerSize) > p.left) {
velocityY = 0;
isGrounded = true;
myVerti = p.top - playerSize;
}
}
if (myVerti <= (p.top + p.height) && velocityY < 0 && prevVerti >= (p.top + p.height) && myHoriz < (p.left + p.width) && (myHoriz + playerSize) > p.left) {
velocityY = 0
myVerti = p.top + p.height
}
});

redPlatforms.forEach(rp => {
let isVerticallyOverlapping = (myVerti + playerSize > rp.top) && (myVerti < rp.top + rp.height);
let isHorizontallyOverlapping = (myHoriz + playerSize > rp.left) && (myHoriz < rp.left + rp.width);
if (isVerticallyOverlapping && isHorizontallyOverlapping) {
console.log('Took 1 damage via Red Platform');
takeDamage(1);
}
});

orangePlatforms.forEach(op => {
let isHorizontallyOverlapping = (myHoriz + playerSize > op.left) && (myHoriz < op.left + op.width);
let isVerticallyOverlapping = (myVerti + playerSize > op.top) && (myVerti < op.top + op.height);
if (isVerticallyOverlapping && isHorizontallyOverlapping) {
if (!isMoving) {
    console.log('Took 1 damage via Orange Platform');
    takeDamage(1);
}
}
});

bluePlatforms.forEach(bp => {
let isHorizontallyOverlapping = (myHoriz + playerSize > bp.left) && (myHoriz < bp.left + bp.width);
let isVerticallyOverlapping = (myVerti + playerSize > bp.top) && (myVerti < bp.top + bp.height);     
if (isVerticallyOverlapping && isHorizontallyOverlapping) {
if (isMoving) {
    console.log('Took 1 damage via Blue Platform');
    takeDamage(1);
}
}
});

greenPlatforms.forEach(gp => {
let isHorizontallyOverlapping = (myHoriz + playerSize > gp.left) && (myHoriz < gp.left + gp.width);
let isVerticallyOverlapping = (myVerti + playerSize > gp.top) && (myVerti < gp.top + gp.height);     
if (isVerticallyOverlapping && isHorizontallyOverlapping && !bossStarted) {
      bossStarted = true;
      startBossBattle();
      gp.element.style.opacity = 0;
}
});

checkpoints.forEach(c => {
    if (myHoriz < c.left + c.width && 
    myHoriz + playerSize > c.left && 
    myVerti < c.top + c.height && 
    myVerti + playerSize > c.top) 
    {
    mySpawnX = c.left
    mySpawnY = c.top
    }
});
if (myHoriz < 0) { myHoriz = 0; }
if (myVerti < 0) { myVerti = 0; }
if (myHoriz > 1090) { myHoriz = 1090; }

isMoving = (left || right || up || down || prevHoriz !== myHoriz || prevVerti !== myVerti);
moveBullets1();
moveBullets2();
moveBullets3();
moveBullets4();
moveBullets5();
moveBullets6();
playerElement.style.top = myVerti + 'px';
playerElement.style.left = myHoriz + 'px';
}
}
function chooseRandomAttack(){
      clearInterval(currentAttackInterval);
      randomAttackNumber = Math.floor(Math.random()*6) + 1;
      if (randomAttackNumber == 1){
            startAttack1();
      }
      else if (randomAttackNumber == 2){
            startAttack2();
      }
      else if (randomAttackNumber == 3){
            startAttack3();
      }
      else if (randomAttackNumber == 4){
            startAttack4();
      }
      else if (randomAttackNumber == 5){
            startAttack5();
      }
      else if (randomAttackNumber == 6){
            startAttack6();
      }
}
function startAttack1(){
      currentAttackInterval = setInterval(spawnBullet1, 100);
      setTimeout(chooseRandomAttack, 10000);
}
function startAttack2(){
      currentAttackInterval = setInterval(spawnBullet2, 100);
      setTimeout(chooseRandomAttack, 10000);
} 
function startAttack3(){
      currentAttackInterval = setInterval(spawnBullet3, 100);
      setTimeout(chooseRandomAttack, 10000);
} 
function startAttack4(){
      currentAttackInterval = setInterval(spawnBullet4, 100);
      setTimeout(chooseRandomAttack, 10000);
} 
function startAttack5(){
      currentAttackInterval = setInterval(spawnBullet5, 100);
      setTimeout(chooseRandomAttack, 10000);
} 
function startAttack6(){
      currentAttackInterval = setInterval(spawnBullet6, 100);
      setTimeout(chooseRandomAttack, 10000);
} 
function startBossBattle(){
      chooseRandomAttack();
      setInterval(function() { bossDamage(1); }, 1000);
}
function updateUI() {
let healthPercent = (playerHealth / maxHealth) * 100;
if (healthPercent < 0) {
healthPercent = 0;
}
let hpBar = document.getElementById("hp-bar");
hpBar.style.width = healthPercent + "%";
let hpText = document.getElementById("hp-text");
hpText.innerText = playerHealth + " / " + maxHealth;
let bossHealthPercent = (bossHealth / bossMaxHealth) * 100;
if (bossHealthPercent < 0) {
bossHealthPercent = 0;
}
let bossHealthGraphic = document.getElementById('bossHealthFill');
bossHealthGraphic.style.width = bossHealthPercent + '%';
let bossHPText = document.getElementById("hpText");
bossHPText.innerText = bossHealth + '/' + bossMaxHealth;
}
function takeDamage(damageAmount) {
if (!isInvincible && playerHealth > 0) {
playerHealth -= damageAmount;
updateUI();
if (playerHealth <= 0) {
playerHealth = 0;
updateUI();
location.reload()
return;
}
isInvincible = true;
playerElement.style.opacity = 0.5;
setTimeout(function() {
isInvincible = false;
playerElement.style.opacity = 1.0;
}, 1000);
}
}

function bossDamage(damageAmount) {
bossHealth -= damageAmount;
if (bossHealth <= 0){
      bossHealth = 0;
      victorySequence();
}
updateUI();
}
function updateDebug() {
const debugElement = document.getElementById('debug');
if (!showDebug){ debug.style.display = 'none'; }
else if (showDebug){ debug.style.display = 'block'; }
if (!debugElement) return;
debugElement.innerHTML = `
---------------- <br>
Game Variables<br>
BossStarted? ${bossStarted}<br>
Invincible? ${isInvincible}<br>
TrueInvincible? ${isTrueInvincible}<br>
RandomAttackNum: ${randomAttackNumber}<br>
---------------- <br>
Player Variables<br>
Up: ${up}<br>
Left: ${left}<br>
Down: ${down}<br>
Right: ${right}<br>
Health: ${playerHealth}<br>
MaxHealth: ${maxHealth}<br>
isMoving? ${isMoving}<br>
isGrounded? ${isGrounded}<br>
wKeyDebounced: ${wKeyDebounced}<br>
sKeyDebounced: ${sKeyDebounced}<br>
aKeyDebounced: ${aKeyDebounced}<br>
dKeyDebounced: ${dKeyDebounced}<br>
X: ${myHoriz}<br>
Y: ${myVerti}<br>
PreviousX: ${Math.round(prevHoriz)}<br>
PreviousY: ${Math.round(prevVerti)}<br>
CursorX: ${myCursorX}<br>
CursorY: ${myCursorY}<br>
`;
}

function spawnBullet1() {
let bullet = document.createElement('img');
bullet.src = 'sprites/arrow-bullet-down.png';
bullet.className = 'bullet-sprite'; 
bullet.style.position = 'absolute';
let randomX = Math.random() * 1050;      
bullet.style.left = randomX + 'px';
bullet.style.top = '-20px';
gameContainer.appendChild(bullet);
bullets1.push({
element: bullet,
x: randomX,
y: -20
});
}
function moveBullets1() {
      bullets1.forEach(bullet => {
            bullet.y += 5;
            bullet.element.style.top = bullet.y + 'px';
            if (bullet.y > 932) {
                  bullet.element.remove();
            }
      if (!isInvincible) {
            if (bullet.x + 15 > myHoriz + 2 && 
                bullet.x + 15 < myHoriz + 30 &&
                bullet.y + 15 > myVerti + 2 && 
                bullet.y + 15 < myVerti + 30) {        
                  takeDamage(1); 
            }
      }
});
bullets1 = bullets1.filter(bullet => bullet.y <= 932);
}
function spawnBullet2(){
      let bullet = document.createElement('img');
      bullet.src = 'sprites/arrow-bullet-right.png';
      bullet.className = 'bullet-sprite'; 
      bullet.style.position = 'absolute';
      let randomY = Math.random() * 868;      
      bullet.style.left = '0px';
      bullet.style.top = randomY + 'px';
      gameContainer.appendChild(bullet);
      bullets2.push({
            element: bullet,
            x: 0,
            y: randomY,
      });
}
function moveBullets2(){
      bullets2.forEach(bullet => {
            bullet.x += 5;
            bullet.element.style.left = bullet.x + 'px';
            if (bullet.x > 1082) {
                  bullet.element.remove();
            }
      if (!isInvincible) {
            if (bullet.x + 15 > myHoriz + 2 && 
            bullet.x + 15 < myHoriz + 30 &&
            bullet.y + 15 > myVerti + 2 && 
            bullet.y + 15 < myVerti + 30) {        
                  takeDamage(1); 
                  }
            }
      });
bullets2 = bullets2.filter(bullet => bullet.x <= 1082);
}
function spawnBullet3(){
      let bullet = document.createElement('img');
      bullet.src = 'sprites/arrow-bullet-left.png';
      bullet.className = 'bullet-sprite'; 
      bullet.style.position = 'absolute';
      let randomY = Math.random() * 868;      
      bullet.style.left = '1082px';
      bullet.style.top = randomY + 'px';
      gameContainer.appendChild(bullet);
      bullets3.push({
            element: bullet,
            x: 1082,
            y: randomY,
      });
}
function moveBullets3(){
      bullets3.forEach(bullet => {
            bullet.x -= 5;
            bullet.element.style.left = bullet.x + 'px';
            if (bullet.x < 0) {
                  bullet.element.remove();
            }
      if (!isInvincible) {
            if (bullet.x + 15 > myHoriz + 2 && 
            bullet.x + 15 < myHoriz + 30 &&
            bullet.y + 15 > myVerti + 2 && 
            bullet.y + 15 < myVerti + 30) {        
                  takeDamage(1); 
                  }
            }
      });
bullets3 = bullets3.filter(bullet => bullet.x >= 0);
}
function spawnBullet4() {
let bullet = document.createElement('img');
bullet.src = 'sprites/arrow-bullet-up.png';
bullet.className = 'bullet-sprite'; 
bullet.style.position = 'absolute';
let randomX = Math.random() * 1050;      
bullet.style.left = randomX + 'px';
bullet.style.top = '932px';
gameContainer.appendChild(bullet);
bullets1.push({
element: bullet,
x: randomX,
y: 932
});
}
function moveBullets4() {
      bullets1.forEach(bullet => {
            bullet.y -= 3;
            bullet.element.style.top = bullet.y + 'px';
            if (bullet.y > -32) {
                  bullet.element.remove();
            }
      if (!isInvincible) {
            if (bullet.x + 15 > myHoriz + 2 && 
                bullet.x + 15 < myHoriz + 30 &&
                bullet.y + 15 > myVerti + 2 && 
                bullet.y + 15 < myVerti + 30) {        
                  takeDamage(1); 
            }
      }
});
bullets1 = bullets1.filter(bullet => bullet.y <= -32);
}
function spawnBullet5(){}
function moveBullets5(){}
function spawnBullet6(){}
function moveBullets6(){}

function victorySequence(){}
function startBattle() {
updateUI();
setInterval(movement, 10);
playerElement.style.top = myVerti + 'px';
playerElement.style.left = myHoriz + 'px';
}
startBattle();
</script>
</body>
</html>
