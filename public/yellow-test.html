<!DOCTYPE html> 
<html>
<head>
<title>yellow-test.html</title>
<style>
.yellow {color:yellow;}
.white {color:white;}
.blend {background-color:black;color:white;border-color:black;}
.bullet-sprite { width: 20px; height: 20px; }
@font-face { font-family: 'DeterminationMono'; src: url('font/DeterminationMonoWebRegular-Z5oq.ttf') format('truetype'); }
body {height:100vh; margin: 0; background-color:black; position: relative; font-family: 'DeterminationMono', monospace; }
#gameContainer {width: 1050px; position: absolute; left: 400px; display: flex; flex-direction: column; box-sizing: border-box;}
#hp-section { display: flex; justify-content: center; color: white; font-family: 'DeterminationMono', monospace; margin-top: 0px;}
#hp-display-group { display: flex; flex-direction: column; align-items: center; margin-left: 30px;}
#hp-container { width: 300px; height: 60px; background-color: #c00; margin: 0 10px;}
#hp-bar { width: 100%; height: 100%; background-color: #ffff00;}
#hp-text { font-size: 48px; }
</style>
</head>
<body style="background-color:black; position: relative; overflow: hidden;">
<div id="debug" style="position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: lime; font-family: monospace; padding: 10px; border: 1px solid lime; z-index: 1000; font-size: 14px; pointer-events: none;">
</div>
<div id="gameContainer">
<input type="button" class="blend" onClick="startAttackOne()" value="Example attack 1">
<input type="button" class="blend" onClick="startAttackTwo()" value="Example attack 2">
<img src="sprites/soul-06-down.png" width="32" height="32" id="myPlayer01" style="position: absolute; left: 284px; top: 134px; opacity: 1.0; z-index: 100;">
<div id="hp-section"> 
<div id="hp-display-group">
<div id="hp-text-wrapper">
<span style="font-size:48px;">HP:</span>
<span id="hp-text">Infinite</span>
</div>
<div id="hp-container">
<div id="hp-bar"></div>
</div>
</div>
</div>
<script>
let enemyContainer = document.getElementById('enemyContainer');
let gameContainer = document.getElementById('gameContainer');
let playerElement = document.getElementById('myPlayer01');
let maxHoriz;
let maxVerti;
let showDebug = false;
let myHoriz = 513;
let myVerti = 492;
let prevHoriz;
let prevVerti;
let isMoving = false;
let up = false;
let down = false;
let right = false;
let left = false;
let rotateKeyDebounced = false;
let wKeyDebounced = false;
let sKeyDebounced = false;
let shootKeyDebounced = false;
let actionKeyPressed = false;
let isAttackOne = false;
let isAttackTwo = false;
let isInvincible = false;
let isTrueInvincible = false;
let playerHealth = Infinity;
let maxHealth = Infinity;
let containerRect = gameContainer.getBoundingClientRect();
let bullets = [];
let bullets2 = [];
let bulletSpawner1;
let bulletSpawner2;
let bulletTimer = 100;
let bulletTimer2 = 100;
let bulletColorNum;
let actualTop;
let playerBullets = [];
let facing = 'down';

document.onkeydown = function(event){
    if (event.key === "w"){
        up = true;
    }
    if (event.key === "s"){
        down = true;
    }
    if (event.key === "a"){
        left = true;
    }
    if (event.key === "d"){
        right = true;
    }
    if (event.ctrlKey && event.key === "q"){
        showDebug = !showDebug;
        const debugElement = document.getElementById('debug');
        if (showDebug) {
            debugElement.style.display = 'block';
        } else {
            debugElement.style.display = 'none';
        }
    }
    if (event.key === "z" || event.key === "Z" || event.key === " ") {
        if (!shootKeyDebounced){
            shootKeyDebounced = true;
            shootPlayerBullet();
        }
    }
    if (event.key === "e" || event.key === "E") {
        if (!rotateKeyDebounced){
            rotateKeyDebounced = true;
            rotatePlayer();
        }
    }
};

document.onkeyup = function(event){
    if (event.key === "w"){up = false; wKeyDebounced = false;}
    if (event.key === "s"){down = false; sKeyDebounced = false;}
    if (event.key === "a"){left = false;}
    if (event.key === "d"){right = false;}
    if (event.key === "z" || event.key === "Z" || event.key === " ") {
        shootKeyDebounced = false;
    }
    if (event.key === "e" || event.key === "E") {
        rotateKeyDebounced = false;
    }
};

function movement() {
    updateDebug();
    prevHoriz = myHoriz; 
    prevVerti = myVerti;
    
    if (up) { myVerti -= 3; }
    if (down) { myVerti += 3; }
    if (left) { myHoriz -= 3; }
    if (right) { myHoriz += 3; }
    
    if (myHoriz < 0) { myHoriz = 0; }
    if (myVerti < 0) { myVerti = 0; }
    if (myHoriz > 1090) { myHoriz = 1090; }
    if (myVerti > 900) { myVerti = 900; }
    
    moveBullets1();
    moveBullets2();
    movePlayerBullets();

    playerElement.style.top = myVerti + 'px';
    playerElement.style.left = myHoriz + 'px';
    
    if (prevHoriz !== myHoriz || prevVerti !== myVerti) { isMoving = true; }
    else { isMoving = false; }
}
function rotatePlayer(){
    if (facing === "down"){
        facing = "left"; 
        playerElement.src = 'sprites/soul-06-left.png';
    }
    else if (facing === "left"){
        facing = "up";
        playerElement.src = 'sprites/soul-06-up.png';
    }
    else if (facing === "up"){
        facing = "right";
        playerElement.src = 'sprites/soul-06-right.png';
    }
    else if (facing === "right"){
        facing = "down";
        playerElement.src = 'sprites/soul-06-down.png';
    }
}
    
function updateDebug() {
    const debugElement = document.getElementById('debug');
    if (!debugElement) return;
    if (!showDebug){debugElement.style.display = 'none'; return;}
    else if (showDebug){debugElement.style.display = 'block';}
    debugElement.innerHTML = `
---------------- <br>
Game Variables<br>
---------------- <br>
Player Variables<br>
Up: ${up}<br>
Left: ${left}<br>
Down: ${down}<br>
Right: ${right}<br>
Facing: ${facing}<br>
isMoving? ${isMoving}<br>
ShootKeyDebounced: ${shootKeyDebounced}<br>
RotateKeyDebounced: ${rotateKeyDebounced}<br>
X: ${myHoriz}<br>
Y: ${playerElement.style.top}<br>
PreviousX: ${prevHoriz}<br>
PreviousY: ${prevVerti}<br>
`;
}

function updateUI() {
    let healthPercent = (playerHealth / maxHealth) * 100;
    if (healthPercent < 0) {
        healthPercent = 0;
    }
    let hpBar = document.getElementById("hp-bar");
    hpBar.style.width = healthPercent + "%";
    let hpText = document.getElementById("hp-text");
    hpText.innerText = playerHealth === Infinity ? "Infinite" : (playerHealth + " / " + maxHealth);
}

function takeDamage(damageAmount) {
    if (isTrueInvincible){return;}
    else if (!isInvincible && playerHealth > 0) {
        if(playerHealth !== Infinity) playerHealth -= damageAmount;
        isInvincible = true;
        playerElement.style.opacity = 0.5;
        setTimeout(function() {
            isInvincible = false;
            playerElement.style.opacity = 1.0;
        }, 1000);
    }
}

function startAttackOne() {
    endAttackTwo();
    clearInterval(bulletSpawner1);
    bulletSpawner1 = setInterval(spawnbullet1, bulletTimer);
    isAttackOne = true;
    setTimeout(endAttackOne, 5000);
}

function spawnbullet1() {
    let bullet = document.createElement('img');
    bullet.style.position = 'absolute';
    let randomX = Math.random() * 1090;      
    bullet.style.left = randomX + 'px';
    bullet.style.top = '150px';
    gameContainer.appendChild(bullet);
    bullets.push({
        element: bullet,
        x: randomX,
        y: 150,
    });
    bullet.classList.add('bullet-sprite');
    bullet.src = 'sprites/placeholder-bullet-yellow.png';
}

function moveBullets1() {
    bullets.forEach(bullet => {
        bullet.y += 5;
        bullet.element.style.top = bullet.y + 'px';
        if (bullet.y > 1000) {
            bullet.element.remove();
            bullet.removed = true;
        }
        if (!isInvincible) {
                if (bullet.x + 10 > myHoriz + 2 && 
                    bullet.x + 10 < myHoriz + 30 &&
                    bullet.y + 10 > myVerti + 2 && 
                    bullet.y + 10 < myVerti + 30) {
                    takeDamage(10);
                    bullet.element.remove();
                    bullet.removed = true;
                }
            }
        });
    bullets = bullets.filter(bullet => bullet.y <= 1000 && !bullet.removed);
}

function endAttackOne() {
    if (isAttackOne) {
        isAttackOne = false;
        clearInterval(bulletSpawner1);
        bullets.forEach(bullet => {
            bullet.element.remove();
        });
        bullets = [];
    }
}

function startAttackTwo() {
    endAttackOne();
    clearInterval(bulletSpawner2);
    bulletSpawner2 = setInterval(spawnbullet2, bulletTimer2);
    isAttackTwo = true;
    setTimeout(endAttackTwo, 6000);
}

function spawnbullet2() {
    let bullet = document.createElement('img');
    bullet.style.position = 'absolute';
    let randomY = Math.random() * 870;
    bullet.style.left = '50px';
    bullet.style.top = randomY + 'px';
    gameContainer.appendChild(bullet);
    bullets2.push({
        element: bullet,
        x: 50,
        y: randomY,
    });
    bullet.src = 'sprites/placeholder-bullet-yellow.png';
    bullet.classList.add('bullet-sprite');
}

function moveBullets2() {
    bullets2.forEach(bullet => {
        bullet.x += 5;
        bullet.element.style.left = bullet.x + 'px';
        if (bullet.x > 1000) {
            bullet.element.remove();
            bullet.removed = true;
        }
        if (!isInvincible) {
            if (bullet.x + 10 > myHoriz + 2 && 
                bullet.x + 10 < myHoriz + 30 &&
                bullet.y + 10 > myVerti + 2 && 
                bullet.y + 10 < myVerti + 30) {
                takeDamage(10);
                bullet.element.remove();
                bullet.removed = true;
            }
        }
    });
    bullets2 = bullets2.filter(bullet => bullet.x <= 1000 && !bullet.removed);
}

function endAttackTwo() {
    if (isAttackTwo) {
        isAttackTwo = false;
        clearInterval(bulletSpawner2);
        bullets2.forEach(bullet => {
            bullet.element.remove();
        });
        bullets2 = [];
    }
}

function shootPlayerBullet() {
    let bullet = document.createElement('img');
    bullet.style.position = 'absolute';
    bullet.style.width = '16px';
    bullet.style.height = '16px';
    bullet.src = 'sprites/yellow-soul-bullet.png';
    bullet.style.zIndex = '99';

    let startX = myHoriz + 9;
    let startY = myVerti + 9;

    bullet.style.left = startX + 'px';
    bullet.style.top = startY + 'px';
    gameContainer.appendChild(bullet);

    let velocityX = 0;
    let velocityY = 0;
    const speed = 10;

    switch (facing) {
        case 'up': velocityY = -speed; bullet.src = 'sprites/yellow-soul-bullet.png'; break;
        case 'down': velocityY = speed; bullet.src = 'sprites/yellow-soul-bullet-down.png'; break;
        case 'left': velocityX = -speed; bullet.src = 'sprites/yellow-soul-bullet-left.png'; break;
        case 'right': velocityX = speed; bullet.src = 'sprites/yellow-soul-bullet-right.png'; break;
    }

    playerBullets.push({
        element: bullet,
        x: startX,
        y: startY,
        veloX: velocityX,
        veloY: velocityY
    });
}

function movePlayerBullets() {
    playerBullets.forEach(pBullet => {
        pBullet.x += pBullet.veloX;
        pBullet.y += pBullet.veloY;

        pBullet.element.style.left = pBullet.x + 'px';
        pBullet.element.style.top = pBullet.y + 'px';

        if (pBullet.x < 0 || pBullet.x > 1100 || pBullet.y < 0 || pBullet.y > 900) {
            pBullet.element.remove();
            pBullet.removed = true;
            return;
        }

        bullets.forEach(eBullet => {
            if (!eBullet.removed && !pBullet.removed) {
                if (pBullet.x < eBullet.x + 20 &&
                    pBullet.x + 16 > eBullet.x &&
                    pBullet.y < eBullet.y + 20 &&
                    pBullet.y + 16 > eBullet.y) {
                    
                    pBullet.element.remove();
                    pBullet.removed = true;
                    eBullet.element.remove();
                    eBullet.removed = true;
                }
            }
        });

        bullets2.forEach(eBullet => {
            if (!eBullet.removed && !pBullet.removed) {
                if (pBullet.x < eBullet.x + 20 &&
                    pBullet.x + 16 > eBullet.x &&
                    pBullet.y < eBullet.y + 20 &&
                    pBullet.y + 16 > eBullet.y) {
                    
                    pBullet.element.remove();
                    pBullet.removed = true;
                    eBullet.element.remove();
                    eBullet.removed = true;
                }
            }
        });
    });

    playerBullets = playerBullets.filter(bullet => !bullet.removed);
}

function startBattle() {
    setInterval(movement, 10);
    playerElement.style.top = myVerti + 'px';
    playerElement.style.left = myHoriz + 'px';
}

startBattle();
</script>
</body>
</html>
