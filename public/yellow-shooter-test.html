<!DOCTYPE html> 
<html>
<head>
<title>yellow-shooter-test.html</title>
<style>
.yellow {color:yellow;}
.white {color:white;}
.blend {background-color:black;color:white;border-color:black;}
.bullet-sprite { width: 20px; height: 20px; }
@font-face { font-family: 'DeterminationMono'; src: url('font/DeterminationMonoWebRegular-Z5oq.ttf') format('truetype'); }
body {height:100vh; margin: 0; background-color:black; position: relative; font-family: 'DeterminationMono', monospace; }
#gameContainer {width: 1050px; position: absolute; left: 400px; display: flex; flex-direction: column; box-sizing: border-box;}
#hp-section { display: flex; justify-content: center; color: white; font-family: 'DeterminationMono', monospace; margin-top: 0px;}
#hp-display-group { display: flex; flex-direction: column; align-items: center; margin-left: 30px;}
#hp-container { width: 300px; height: 60px; background-color: #c00; margin: 0 10px;}
#hp-bar { width: 100%; height: 100%; background-color: #ffff00;}
#hp-text { font-size: 48px; }
</style>
</head>
<body style="background-color:black; position: relative; overflow: hidden;">
<div id="debug" style="position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: lime; font-family: monospace; padding: 10px; border: 1px solid lime; z-index: 1000; font-size: 14px; pointer-events: none; display: none;">
</div>
<div id="gameContainer">
<img src="sprites/soul-06-down.png" width="32" height="32" id="myPlayer01" style="position: absolute; left: 284px; top: 134px; opacity: 1.0; z-index: 100;">
<div id="hp-section"> 
<div id="hp-display-group">
<div id="hp-text-wrapper">
<span style="font-size:48px;">HP:</span>
<span id="hp-text">10/10</span>
</div>
<div id="hp-container">
<div id="hp-bar"></div>
</div>
</div>
</div>
</div>

<script>
const enemyTypes = {
    chaser: {
        health: 10,
        speed: 3.5,
        damage: 1,
        size: 32
    },
    ranger: {
        health: 5,
        speed: 1,
        damage: 1,
        size: 32
    }
};
const waveConfigurations = [
    { waveID: 1, enemies: [{ type: 'chaser', count: 5 }] },
    { waveID: 2, enemies: [{ type: 'chaser', count: 5 }, { type: 'ranger', count: 3 }] },
];
let activeEnemies = [];
let enemyContainer = document.getElementById('enemyContainer');
let gameContainer = document.getElementById('gameContainer');
let playerElement = document.getElementById('myPlayer01');
let maxHoriz;
let maxVerti;
let showDebug = false;
let myHoriz = 513;
let myVerti = 492;
let prevHoriz;
let prevVerti;
let isMoving = false;
let up = false;
let down = false;
let right = false;
let left = false;
let rotateKeyDebounced = false;
let otherRotateKeyDebounced = false;
let wKeyDebounced = false;
let sKeyDebounced = false;
let shootKeyDebounced = false;
let actionKeyPressed = false;
let isInvincible = false;
let isTrueInvincible = false;
let playerHealth = 5;
let maxHealth = 5;
let playerSpeed = 3;
let playerDamage = 1;
let maxBullets = 4;
let bulletSize = 1.0;
let bulletSpeed = 10;
let containerRect = gameContainer.getBoundingClientRect();
let enemySize = 32;
let actualTop;
let playerBullets = [];
let facing = 'down';
let tutorialOnScreen = true;

document.onkeydown = function(event){
    if (event.key === "w" || event.key === "W"){
        up = true;
    }
    if (event.key === "s" || event.key === "S"){
        down = true;
    }
    if (event.key === "a" || event.key === "A"){
        left = true;
    }
    if (event.key === "d" || event.key === "D"){
        right = true;
    }
    if (event.ctrlKey && (event.key === "q" || event.key === "Q")){
        showDebug = !showDebug;
        const debugElement = document.getElementById('debug');
        if (showDebug) {
            debugElement.style.display = 'block';
        } else {
            debugElement.style.display = 'none';
        }
    }
    if (event.key === "z" || event.key === "Z" || event.key === " ") {
        if (!shootKeyDebounced && !tutorialOnScreen){
            shootKeyDebounced = true;
            shootPlayerBullet();
        }
    }
    if (event.key === "e" || event.key === "E") {
        if (!rotateKeyDebounced){
            rotateKeyDebounced = true;
            rotatePlayer();
        }
    }
    if ((event.key === "q" || event.key === "Q") && !event.ctrlKey){
        if (!otherRotateKeyDebounced){
            otherRotateKeyDebounced = true;
            otherRotatePlayer();
        }
    }
    if (event.key === " " && tutorialOnScreen){
        tutorialOnScreen = false;
        startGame();
    }
};

document.onkeyup = function(event){
    if (event.key === "w" || event.key === "W"){up = false; wKeyDebounced = false;}
    if (event.key === "s" || event.key === "S"){down = false; sKeyDebounced = false;}
    if (event.key === "a" || event.key === "A"){left = false;}
    if (event.key === "d" || event.key === "D"){right = false;}
    if (event.key === "z" || event.key === "Z" || event.key === " ") {
        shootKeyDebounced = false;
    }
    if (event.key === "e" || event.key === "E") {
        rotateKeyDebounced = false;
    }
    if ((event.key === "q" || event.key === "Q") && !event.ctrlKey){
        otherRotateKeyDebounced = false;
    }
};

function movement() {
    updateDebug();
    prevHoriz = myHoriz; 
    prevVerti = myVerti;
    
    if (up) { myVerti -= playerSpeed; }
    if (down) { myVerti += playerSpeed; }
    if (left) { myHoriz -= playerSpeed; }
    if (right) { myHoriz += playerSpeed; }
    
    if (myHoriz < 0) { myHoriz = 0; }
    if (myVerti < 0) { myVerti = 0; }
    if (myHoriz > 1020) { myHoriz = 1020; }
    if (myVerti > 860) { myVerti = 860; }
    
    movePlayerBullets();
    updateUI();
    updateEnemies();
    
    // Enemy collision
    activeEnemies.forEach(enemy => {
        if (!enemy.removed) {
            if (myHoriz < enemy.x + 32 &&
                myHoriz + 32 > enemy.x &&
                myVerti < enemy.y + 32 &&
                myVerti + 32 > enemy.y) {
                takeDamage(enemy.damage);
            }
        }
    });

    playerElement.style.top = myVerti + 'px';
    playerElement.style.left = myHoriz + 'px';
    
    if (prevHoriz !== myHoriz || prevVerti !== myVerti) { isMoving = true; }
    else { isMoving = false; }
}

function rotatePlayer(){
    if (facing === "down"){
        facing = "left"; 
        playerElement.src = 'sprites/soul-06-left.png';
    }
    else if (facing === "left"){
        facing = "up";
        playerElement.src = 'sprites/soul-06-up.png';
    }
    else if (facing === "up"){
        facing = "right";
        playerElement.src = 'sprites/soul-06-right.png';
    }
    else if (facing === "right"){
        facing = "down";
        playerElement.src = 'sprites/soul-06-down.png';
    }
}

function otherRotatePlayer(){
    if (facing === "down"){
        facing = "right"; 
        playerElement.src = 'sprites/soul-06-right.png';
    }
    else if (facing === "right"){
        facing = "up";
        playerElement.src = 'sprites/soul-06-up.png';
    }
    else if (facing === "up"){
        facing = "left";
        playerElement.src = 'sprites/soul-06-left.png';
    }
    else if (facing === "left"){
        facing = "down";
        playerElement.src = 'sprites/soul-06-down.png';
    }
}
    
function updateDebug() {
    const debugElement = document.getElementById('debug');
    if (!debugElement) return;
    if (!showDebug){ debugElement.style.display = 'none'; return; }
    else if (showDebug){ debugElement.style.display = 'block'; }
    debugElement.innerHTML = `
---------------- <br>
Game Variables<br>
---------------- <br>
Player Variables<br>
Up: ${up}<br>
Left: ${left}<br>
Down: ${down}<br>
Right: ${right}<br>
Facing: ${facing}<br>
isMoving? ${isMoving}<br>
ShootKeyDebounced: ${shootKeyDebounced}<br>
RotateKeyDebounced: ${rotateKeyDebounced}<br>
OtherRotateKeyDebounced: ${otherRotateKeyDebounced}<br>
X: ${myHoriz}<br>
Y: ${playerElement.style.top}<br>
PreviousX: ${prevHoriz}<br>
PreviousY: ${prevVerti}<br>
---------------- <br>
Temporary Stats Menu<br>
PlayerSpeed: ${playerSpeed}<br>
PlayerHealth: ${playerHealth}<br>
PlayerDamage: ${playerDamage}<br>
MaxHealth: ${maxHealth}<br>
BulletSpeed: ${bulletSpeed}<br>
BulletSize: ${bulletSize}x<br>
BulletCap: ${maxBullets}<br>
`;
}

function updateUI() {
    let healthPercent = (playerHealth / maxHealth) * 100;
    if (healthPercent < 0) {
        healthPercent = 0;
    }
    let hpBar = document.getElementById("hp-bar");
    hpBar.style.width = healthPercent + "%";
    let hpText = document.getElementById("hp-text");
    if (playerHealth === Infinity){
        hpText.innerText = "Infinite";
    }
    else {
        hpText.innerText = `${playerHealth} / ${maxHealth}`;
    }
}

function takeDamage(damageAmount) {
    if (isTrueInvincible){ return; }
    else if (!isInvincible && playerHealth > 0) {
        if (playerHealth !== Infinity) playerHealth -= damageAmount;
        isInvincible = true;
        playerElement.style.opacity = 0.5;
        setTimeout(function() {
            isInvincible = false;
            playerElement.style.opacity = 1.0;
        }, 1000);
    }
}

function shootPlayerBullet() {
    if (playerBullets.length >= maxBullets) {
        return;
    }

    let bullet = document.createElement('img');
    bullet.style.position = 'absolute';
    bullet.style.width = 16 * bulletSize + 'px';
    bullet.style.height = 16 * bulletSize + 'px';
    bullet.src = 'sprites/yellow-soul-bullet.png';
    bullet.style.zIndex = '99';

    let startX = myHoriz + 9;
    let startY = myVerti + 9;

    bullet.style.left = startX + 'px';
    bullet.style.top = startY + 'px';
    gameContainer.appendChild(bullet);

    let velocityX = 0;
    let velocityY = 0;

    switch (facing) {
        case 'up': velocityY = -bulletSpeed; bullet.src = 'sprites/yellow-soul-bullet.png'; break;
        case 'down': velocityY = bulletSpeed; bullet.src = 'sprites/yellow-soul-bullet-down.png'; break;
        case 'left': velocityX = -bulletSpeed; bullet.src = 'sprites/yellow-soul-bullet-left.png'; break;
        case 'right': velocityX = bulletSpeed; bullet.src = 'sprites/yellow-soul-bullet-right.png'; break;
    }

    playerBullets.push({
        element: bullet,
        x: startX,
        y: startY,
        veloX: velocityX,
        veloY: velocityY
    });
}

function movePlayerBullets() {
    playerBullets.forEach(pBullet => {
        pBullet.x += pBullet.veloX;
        pBullet.y += pBullet.veloY;

        pBullet.element.style.left = pBullet.x + 'px';
        pBullet.element.style.top = pBullet.y + 'px';

        if (pBullet.x < 0 || pBullet.x > 1100 || pBullet.y < 0 || pBullet.y > 900) {
            pBullet.element.remove();
            pBullet.removed = true;
            return;
        }

        activeEnemies.forEach(enemy => {
            if (!enemy.removed && !pBullet.removed) {
                if (pBullet.x < enemy.x + 32 &&
                    pBullet.x + 16 > enemy.x &&
                    pBullet.y < enemy.y + 32 &&
                    pBullet.y + 16 > enemy.y) {
                    
                    pBullet.element.remove();
                    pBullet.removed = true;
                    enemy.health -= playerDamage;
                    if (enemy.health <= 0){
                        enemy.element.remove();
                        enemy.removed = true;
                    }
                }
            }
        });
    });
    
    playerBullets = playerBullets.filter(bullet => !bullet.removed);
    activeEnemies = activeEnemies.filter(enemy => !enemy.removed);
}

function getRandomEdgePosition(containerWidth, containerHeight, enemySize) {
    let side = Math.floor(Math.random() * 3); 
    let x = 0;
    let y = 0;

    if (side === 0) { 
        x = -enemySize;
        y = Math.random() * (containerHeight - 150) + 150; 
    } else if (side === 1) { 
        x = containerWidth + enemySize;
        y = Math.random() * (containerHeight - 150) + 150;
    } else if (side === 2) { 
        x = Math.random() * containerWidth;
        y = containerHeight + enemySize;
    }

    return { x: x, y: y };
}

function spawnWave(waveIndex) {
    let currentWave = waveConfigurations[waveIndex];
    
    for (let i = 0; i < currentWave.enemies.length; i++) {
        let group = currentWave.enemies[i];
        let typeData = enemyTypes[group.type];
        
        for (let j = 0; j < group.count; j++) {
            let spawnPosition = getRandomEdgePosition(1050, 900, typeData.size);
            
            let enemyElement = document.createElement('img');
            enemyElement.style.position = 'absolute';
            enemyElement.style.width = typeData.size + 'px';
            enemyElement.style.height = typeData.size + 'px';
            enemyElement.style.left = spawnPosition.x + 'px';
            enemyElement.style.top = spawnPosition.y + 'px';
            enemyElement.src = 'sprites/soul-08.png';  
            
            gameContainer.appendChild(enemyElement);
            
            activeEnemies.push({
                type: group.type,
                x: spawnPosition.x,
                y: spawnPosition.y,
                health: typeData.health,
                speed: typeData.speed,
                damage: typeData.damage,
                size: typeData.size,
                element: enemyElement,
                removed: false
            });
        }
    }
}

function updateEnemies() {
    activeEnemies.forEach(enemy => {
        if (enemy.removed) return;
        let deltaX = myHoriz - enemy.x;
        let deltaY = myVerti - enemy.y;
        let distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        
        if (distance > 1) {
            enemy.x += (deltaX / distance) * enemy.speed;
            enemy.y += (deltaY / distance) * enemy.speed;
            enemy.element.style.left = enemy.x + 'px';
            enemy.element.style.top = enemy.y + 'px';
        }
    });
}

function startGame() {
    setInterval(movement, 10);
    playerElement.style.top = myVerti + 'px';
    playerElement.style.left = myHoriz + 'px';
    spawnWave(0);
}
</script>
</body>
</html>
