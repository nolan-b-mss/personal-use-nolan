function preloadAssets(sources, callback) {
    let loadedCount = 0;
    const total = sources.length;
    const progressEl = document.getElementById('loadingProgress');
    progressEl.innerText = `0 / ${total}`;

    if (total === 0) {
        callback();
        return;
    }

    sources.forEach(src => {
        const img = new Image();
        img.onload = () => {
            loadedCount++;
            progressEl.innerText = `${loadedCount} / ${total}`;
            if (loadedCount === total) {
                callback();
            }
        };
        img.onerror = () => { // count errors as loaded too
            loadedCount++;
            progressEl.innerText = `${loadedCount} / ${total} (Warnings)`;
            if (loadedCount === total) {
                callback();
            }
        };
        img.src = src;
    });
}

document.onkeydown = function(event){
    if (event.key === "w" || event.key === "W"){ up = true; }
    if (event.key === "s" || event.key === "S"){ down = true; }
    if (event.key === "a" || event.key === "A"){ left = true; }
    if (event.key === "d" || event.key === "D"){ right = true; }
    if (event.ctrlKey && (event.key === "q" || event.key === "Q")){
        showDebug = !showDebug;
        const debugElement = document.getElementById('debug');
        if (debugElement) {
            debugElement.style.display = showDebug ? 'block' : 'none';
        }
    }
    if ((event.key === "z" || event.key === "Z" || event.key === " ") && !playerPaused && !upgradePaused && !shootKeyDebounced) {
        if (!tutorialOnScreen) {
            if (!allowAutoFire){shootKeyDebounced = true;}
            else if (allowAutoFire){shootKeyDebounced = false;}
            event.preventDefault();
            if (allowBigShot && !isChargingBigShot && !shotOnCooldown) {
                isChargingBigShot = true;
                chargeStartTime = Date.now();
            } else if (!allowBigShot && !shotOnCooldown && !allowAutoFire) {
                shootPlayerBullet();
            } else if (!allowBigShot && !shotOnCooldown && allowAutoFire) {
                playerIsShooting = true;
            }
        } else {
            tutorialOnScreen = false;
            startGame();
        }
    }
    if ((event.key === "e" || event.key === "E") && !playerPaused && !upgradePaused) {
        if (!rotateKeyDebounced){
            rotateKeyDebounced = true;
            rotatePlayer();
        }
    }
    if ((event.key === "q" || event.key === "Q") && !event.ctrlKey && !playerPaused && !upgradePaused){
        if (!otherRotateKeyDebounced){
            otherRotateKeyDebounced = true;
            otherRotatePlayer();
        }
    }
    if (event.ctrlKey && event.key === "Backspace" && !playerPaused && !upgradePaused){
        clearEnemies();
    }
    if (event.key === "f" || event.key === "F"){
        playerPaused = !playerPaused;
    }
    if (event.key === "x" || event.key === "X" && readyToRestart){
        location = "yellow-shooter-test.html"
        readyToRestart = false;
    }
};

document.onkeyup = function(event){
    if (event.key === "w" || event.key === "W"){ up = false; }
    if (event.key === "s" || event.key === "S"){ down = false; }
    if (event.key === "a" || event.key === "A"){ left = false; }
    if (event.key === "d" || event.key === "D"){ right = false; }
    if ((event.key === "z" || event.key === "Z" || event.key === " ") && !playerPaused && !upgradePaused) {
        shootKeyDebounced = false;
        playerIsShooting = false;
        if (isChargingBigShot) {
            let chargeDuration = Date.now() - chargeStartTime;
            isChargingBigShot = false;
            if (chargeDuration >= bigShotChargeTime) {
                shootBigShot();
            } else {
                shootPlayerBullet();
            }
            chargeStartTime = 0;
        }
    }
    if ((event.key === "e" || event.key === "E") && !playerPaused && !upgradePaused) {
        rotateKeyDebounced = false; 
    }
    if ((event.key === "q" || event.key === "Q") && !event.ctrlKey && !playerPaused && !upgradePaused){
        otherRotateKeyDebounced = false;
    }
};

function movement() {

    updateDebug();
    let elapsed = Date.now() - chargeStartTime;
    if (!playerPaused && !upgradePaused){
        prevHoriz = myHoriz; 
        prevVerti = myVerti;
        
        if (up) { myVerti -= playerSpeed; }
        if (down) { myVerti += playerSpeed; }
        if (left) { myHoriz -= playerSpeed; }
        if (right) { myHoriz += playerSpeed; }
        
        if (myHoriz < 0) { myHoriz = 0; }
        if (myVerti < 0) { myVerti = 0; }
        if (myHoriz > 1020) { myHoriz = 1020; }
        if (myVerti > 860) { myVerti = 860; }
            
        if (allowBigShot){ bigShotChargeBar.style.opacity = 1.0; }
        if (chargeStartTime === 0){ bigShotChargeBar.src = "sprites/big-shot-charge-empty.png" }
        else if (elapsed > 0 && elapsed <= 125){ bigShotChargeBar.src = "sprites/big-shot-charge-low01.png" }
        else if (elapsed > 125 && elapsed <= 250) { bigShotChargeBar.src = "sprites/big-shot-charge-low02.png" }
        else if (elapsed > 250 && elapsed <= 375) { bigShotChargeBar.src = "sprites/big-shot-charge-low03.png" }
        else if (elapsed > 375 && elapsed <= 500) { bigShotChargeBar.src = "sprites/big-shot-charge-med02.png" }
        else if (elapsed > 500 && elapsed <= 625) { bigShotChargeBar.src = "sprites/big-shot-charge-med01.png" }
        else if (elapsed > 625 && elapsed <= 750) { bigShotChargeBar.src = "sprites/big-shot-charge-high01.png" }
        else if (elapsed > 750 && elapsed <= 875) { bigShotChargeBar.src = "sprites/big-shot-charge-high02.png" }
        else if (elapsed > 875 && elapsed < 1000) { bigShotChargeBar.src = "sprites/big-shot-charge-high03.png" }
        else if (elapsed >= 1000) { bigShotChargeBar.src = "sprites/big-shot-charge-full.gif" }
        
        movePlayerBullets();
        updateUI();
        updateEnemies();
        if (playerIsShooting && !shootKeyDebounced){shootPlayerBullet();}

        //constant statchecks
        if (playerHealth > maxHealth){playerHealth = maxHealth}
        if (playerSpeed < 0.75){playerSpeed = 0.75}
        if (shotCooldown < 5){shotCooldown = 5}
        if (maxHealth < 0){maxHealth = 1}
        if (playerDamage < 0){playerDamage = 0.5}
        if (bulletSizeStat < 0){bulletSizeStat = 0.1}
        if (statCritChance > 1.00 || visualCritChance > 100){statCritChance = 1.00; visualCritChance = 100;}

        
        // enemy collision
        activeEnemies.forEach(enemy => {
            if (!enemy.removed) {
                if (myHoriz < enemy.x + enemy.size &&
                myHoriz + 32 > enemy.x &&
                myVerti < enemy.y + enemy.size &&
                myVerti + 32 > enemy.y) {
                takeDamage(enemy.damage);
                }
            }
        });

        playerElement.style.top = myVerti + 'px';
        playerElement.style.left = myHoriz + 'px';
        bigShotChargeBar.style.top = (myVerti - 60) + 'px';
        bigShotChargeBar.style.left = (myHoriz + 35) + 'px';
        
        if (prevHoriz !== myHoriz || prevVerti !== myVerti) { isMoving = true; }
        else { isMoving = false; }
    }
}

function rotatePlayer(){
    if (facing === "down"){
        facing = "left"; 
        playerElement.src = 'sprites/soul-06-left.png';
    }
    else if (facing === "left"){
        facing = "up";
        playerElement.src = 'sprites/soul-06-up.png';
    }
    else if (facing === "up"){
        facing = "right";
        playerElement.src = 'sprites/soul-06-right.png';
    }
    else if (facing === "right"){
        facing = "down";
        playerElement.src = 'sprites/soul-06-down.png';
    }
}

function otherRotatePlayer(){
    if (facing === "down"){
        facing = "right"; 
        playerElement.src = 'sprites/soul-06-right.png';
    }
    else if (facing === "right"){
        facing = "up";
        playerElement.src = 'sprites/soul-06-up.png';
    }
    else if (facing === "up"){
        facing = "left";
        playerElement.src = 'sprites/soul-06-left.png';
    }
    else if (facing === "left"){
        facing = "down";
        playerElement.src = 'sprites/soul-06-down.png';
    }
}

    let hpText = document.getElementById("hp-text");

Bullet Cooldown: ${shotCooldown}ms<br>
Maximum Bullets: ${maxBullets}<br>
Critical Chance: ${visualCritChance}%<br>
`;
}

function takeDamage(damageAmount) {
    if (isTrueInvincible){ return; }
    else if (!isInvincible && playerHealth > 0) {
        if (playerHealth !== Infinity) {
            playerHealth -= damageAmount;
            damageTaken += damageAmount;
        isInvincible = true;
        playerElement.style.opacity = 0.5;
            if (playerHealth <= 0){
                playerDeath();
            }
        setTimeout(function() {
            isInvincible = false;
            playerElement.style.opacity = 1.0;
            }, 1000);
        }
    }
}

    brokenHeart.style.height = '120px';
    brokenHeart.style.marginBottom = '20px';
    overlay.appendChild(brokenHeart);

    let title = document.createElement('div');
    title.innerText = `You died...`;
    title.style.fontSize = '64px';
    title.style.marginBottom = '40px';
    title.style.color = 'yellow';
    overlay.appendChild(title);

    let subtitle = document.createElement('div');
    subtitle.innerText = `Game summary:`;
    subtitle.style.fontSize = '32px';
    subtitle.style.marginBottom = '40px';
    subtitle.style.color = 'white';
    overlay.appendChild(subtitle);

    let summary = document.createElement('div');
    summary.innerText = `
    Wave ${currentWaveIndex}
    Speed: ${playerSpeed}
    Damage: ${playerDamage}
    Bullet Speed: ${bulletSpeed}
    Bullet Size: ${bulletSizeStat}x
    Maximum Bullets: ${maxBullets}
    Bullet Cooldown: ${shotCooldown}
    Damage Dealt: ${totalDamage}
    Debuff Damage: ${totalDebuffDamage}
    Damage Taken: ${damageTaken}
    Critical Chance: ${statCritChance}%
    Shots Fired: ${timesFired}
    Enemies Defeated: ${enemiesDefeated}
    
    Press X to restart.
    `;
    summary.style.fontSize = '20px';
    summary.style.color = 'white';
    summary.style.marginBottom = '40px';
    overlay.appendChild(summary);
}

function triggerUpgradesMenu(){
    upgradePaused = true;
    let availableUpgrades = upgrades.filter(upg => !upg.oneTime || (upg.oneTime && !claimedOneTimeUpgradeIDs.has(upg.upgradeID)));
    let overlay = document.createElement('div');
    overlay.id = 'upgradeOverlay';
    overlay.style.position = 'fixed';
    overlay.style.top = '0';
    overlay.style.left = '0';
    overlay.style.width = '100vw';
    overlay.style.height = '100vh';
    overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.85)';
    overlay.style.zIndex = '4000';
    overlay.style.display = 'flex';
    overlay.style.flexDirection = 'column';
    overlay.style.justifyContent = 'center';
    overlay.style.alignItems = 'center';
    overlay.style.color = 'white';
    overlay.style.fontFamily = "'DeterminationMono', monospace";

    let title = document.createElement('div');
    title.innerText = `Select an upgrade`;
    title.style.fontSize = '32px';
    title.style.marginBottom = '40px';
    title.style.color = 'yellow';
    overlay.appendChild(title);

    let randomChoices = [...upgrades].sort(() => 0.5 - Math.random()).slice(0, 3);

    let container = document.createElement('div');
    container.style.display = 'flex';
    container.style.gap = '20px';

    randomChoices.forEach(upgrade => {
        let card = document.createElement('button');
        card.style.display = 'flex';
        card.style.flexDirection = 'column';
        card.style.justifyContent = 'center';
        card.style.alignItems = 'center';
        card.style.width = '250px';
        card.style.padding = '25px 20px';
        card.style.backgroundColor = 'black';
        card.style.color = 'white';
        card.style.border = '2px solid yellow';
        card.style.fontFamily = "'DeterminationMono', monospace";
        card.style.cursor = 'pointer';
        card.style.lineHeight = '1.5';

        let nameHeader = document.createElement('div');
        nameHeader.innerText = upgrade.name;
        nameHeader.style.fontSize = '20px';
        nameHeader.style.fontWeight = 'bold';
        nameHeader.style.marginBottom = '15px';
        nameHeader.style.color = 'yellow';
        nameHeader.style.fontFamily = "DeterminationMono"
        card.appendChild(nameHeader);

        let descText = document.createElement('div');
        descText.innerText = upgrade.desc;
        descText.style.fontSize = '14px';
        descText.style.textAlign = 'center';
        descText.style.lineHeight = '1.4';
        card.appendChild(descText);

        card.onmouseover = () => { card.style.backgroundColor = 'yellow'; card.style.color = 'black'; nameHeader.style.color = 'black'; };
        card.onmouseout = () => { card.style.backgroundColor = 'black'; card.style.color = 'white'; nameHeader.style.color = 'yellow'; };

        card.onclick = () => {
            totalUpgrades += 1;
            upgrade.apply();
            overlay.remove();
            upgradePaused = false;

            if (currentWaveIndex < waveConfigurations.length) {
                setTimeout(() => spawnWave(currentWaveIndex), 1000);
            } else {
                gameRunning = false;
            }
        };

        container.appendChild(card);
    });

    overlay.appendChild(container);
    document.body.appendChild(overlay);
}

function shootPlayerBullet() {
    if (playerBullets.length >= maxBullets || shotOnCooldown) {
        return;
    }
    shotOnCooldown = true;
    timesFired += 1;
    bulletSize = 16 * bulletSizeStat;
    let bullet = document.createElement('img');
    bullet.style.position = 'absolute';
    bullet.style.width = bulletSize + 'px';
    bullet.style.height = bulletSize + 'px';
    bullet.src = 'sprites/yellow-soul-bullet.png';
    bullet.style.zIndex = '99';

    let startX = myHoriz + 9;
    let startY = myVerti + 9;

    bullet.style.left = startX + 'px';
    bullet.style.top = startY + 'px';
    gameContainer.appendChild(bullet);

    let velocityX = 0;
    let velocityY = 0;

    switch (facing) {
        case 'up': velocityY = -bulletSpeed; bullet.src = 'sprites/yellow-soul-bullet.png'; break;
        case 'down': velocityY = bulletSpeed; bullet.src = 'sprites/yellow-soul-bullet-down.png'; break;
        case 'left': velocityX = -bulletSpeed; bullet.src = 'sprites/yellow-soul-bullet-left.png'; break;
        case 'right': velocityX = bulletSpeed; bullet.src = 'sprites/yellow-soul-bullet-right.png'; break;
    }

    setTimeout(() => {
        shotOnCooldown = false;
    }, shotCooldown);

    playerBullets.push({
        element: bullet,
        x: startX,
        y: startY,
        veloX: velocityX,
        veloY: velocityY
    });
}

function shootBigShot() {
    timesFired += 1;
    let bigBullet = document.createElement('img');
    bigBullet.style.position = 'absolute';
    bigBullet.style.width = '60px';
    bigBullet.style.height = '60px';
    bigBullet.src = "sprites/shard0.png";
    bigBullet.style.zIndex = '99';

    let startX = myHoriz;
    let startY = myVerti;

    bigBullet.style.left = startX + 'px';
    bigBullet.style.top = startY + 'px';
    gameContainer.appendChild(bigBullet);

    let velocityX = 0;
    let velocityY = 0;
    let speed = bulletSpeed * 0.9;

    switch (facing) {
        case 'up': velocityY = -speed; bigBullet.src = "sprites/big-shot-up.png"; break;
        case 'down': velocityY = speed; bigBullet.src = "sprites/big-shot-down.png"; break;
        case 'left': velocityX = -speed; bigBullet.src = "sprites/big-shot-left.png"; break;
        case 'right': velocityX = speed; bigBullet.src = "sprites/big-shot-right.png"; break;
    }

    playerBullets.push({
        element: bigBullet,
        x: startX,
        y: startY,
        veloX: velocityX,
        veloY: velocityY,
        size: 60,
        isBigShot: true,
        damagedEnemies: new Set(),
    });
}

function movePlayerBullets() {
    playerBullets.forEach(pBullet => {
        pBullet.x += pBullet.veloX;
        pBullet.y += pBullet.veloY;

        pBullet.element.style.left = pBullet.x + 'px';
        pBullet.element.style.top = pBullet.y + 'px';

        if (pBullet.x < 0 || pBullet.x > 1100 || pBullet.y < 0 || pBullet.y > 900) {
            pBullet.element.remove();
            pBullet.removed = true;
            return;
        }

        activeEnemies.forEach(enemy => {
            if (!enemy.removed && !pBullet.removed) {
                let currentBulletSize = pBullet.isBigShot ? 60 : bulletSize;
                
                if (pBullet.x < enemy.x + enemy.size &&
                    pBullet.x + currentBulletSize > enemy.x &&
                    pBullet.y < enemy.y + enemy.size &&
                    pBullet.y + currentBulletSize > enemy.y) {

                    if (pBullet.isBigShot) {
                        if (pBullet.damagedEnemies.has(enemy)) return; 
                        pBullet.damagedEnemies.add(enemy);
                        enemy.health -= playerDamage * 5;
                        totalDamage += playerDamage * 5;
                            
                    }
                    if (!pBullet.isBigShot) {
                        let critDamage = playerDamage * 2
                        let critRoll = Math.random()
                        let crit = critRoll < statCritChance;                      
                        pBullet.element.remove();
                        pBullet.removed = true;
                        if (crit)
                        {
                        enemy.element.style.filter = 'brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(1000%)';
                        setTimeout(() => {
                        if (!enemy.removed) {
                            enemy.element.style.filter = 'none';
                        }
                        }, 100);   
                        enemy.health -= critDamage;
                        totalDamage += critDamage;
                        } else {
                        enemy.element.style.filter = 'brightness(2) sepia(1) hue-rotate(5deg) saturate(1000%)';
                        setTimeout(() => {
                        if (!enemy.removed) {
                            enemy.element.style.filter = 'none';
                        }
                        }, 100);  
                        enemy.health -= playerDamage;
                        totalDamage += playerDamage;
                        }
                    }
                    if (allowPoisonShot && !enemy.isPoisoned){
                        enemy.isPoisoned = true;
                        }

                    if (enemy.health <= 0){
                        enemiesDefeated += 1;
                        enemy.element.remove();
                        enemy.removed = true;
                        
                        if (enemy.type === 'splitter') {
                            for (let i = 0; i < 2; i++) {
                                spawnSplitChild('splitter01', enemy);
                            }
                        }
                        if (enemy.type === 'splitter01') {
                            for (let i = 0; i < 4; i++) {
                                spawnSplitChild('splitter02', enemy);
                            }
                        }
                        if (enemy.type === 'splitter02') {
                            for (let i = 0; i < 8; i++) {
                                spawnSplitChild('splitter03', enemy);
                            }
                        }
                    }
                    }
                }
            })
        });
    playerBullets = playerBullets.filter(bullet => !bullet.removed);
    activeEnemies = activeEnemies.filter(enemy => !enemy.removed);
    };
    



function spawnSplitChild(childType, enemy) {
    let childTypeData = enemyTypes[childType];
    let childElement = document.createElement('img');
    let offsetX = (Math.random() - 0.5) * 40;
    let offsetY = (Math.random() - 0.5) * 40;
    let childX = enemy.x + offsetX;
    let childY = enemy.y + offsetY;
    childElement.style.position = 'absolute';
    childElement.style.width = childTypeData.size + 'px';
    childElement.style.height = childTypeData.size + 'px';
    childElement.style.left = enemy.x + 'px';
    childElement.style.top = enemy.y + 'px';
    childElement.src = 'sprites/soul-08.png';
    
    gameContainer.appendChild(childElement);
    
    activeEnemies.push({
        type: childType,
        x: childX,
        y: childY,
        health: childTypeData.health,
        speed: childTypeData.speed,
        damage: childTypeData.damage,
        size: childTypeData.size,
        element: childElement,
        isPoisoned: false,
        removed: false
    });
}

function getRandomEdgePosition(containerWidth, containerHeight, enemySize) {
    let side = Math.floor(Math.random() * 3); //3 on purpose, dont want to spawn on top
    let x = 0;
    let y = 0;

    if (side === 0) { 
        x = enemySize;
        y = Math.random() * (containerHeight - 150) + 150; 
    } else if (side === 1) { 
        x = containerWidth + enemySize;
        y = Math.random() * (containerHeight - 150) + 150;
    } else if (side === 2) { 
        x = Math.random() * containerWidth;
        y = containerHeight + enemySize;
    }

    return { x: x, y: y };
}

function spawnWave(waveIndex) {
    if (waveIndex >= waveConfigurations.length) {
        gameRunning = false;
        return;
    }
    let currentWave = waveConfigurations[waveIndex];
    
    for (let i = 0; i < currentWave.enemies.length; i++) {
        let group = currentWave.enemies[i];
        let typeData = enemyTypes[group.type];
        
        for (let j = 0; j < group.count; j++) {
            let spawnPosition = getRandomEdgePosition(1050, 900, typeData.size);
            
            let enemyElement = document.createElement('img');
            enemyElement.style.position = 'absolute';
            enemyElement.style.width = typeData.size + 'px';
            enemyElement.style.height = typeData.size + 'px';
            enemyElement.style.left = spawnPosition.x + 'px';
            enemyElement.style.top = spawnPosition.y + 'px';
            enemyElement.src = 'sprites/soul-08.png';  
            
            gameContainer.appendChild(enemyElement);
            
            activeEnemies.push({
                type: group.type,
                x: spawnPosition.x,
                y: spawnPosition.y,
                health: typeData.health,
                speed: typeData.speed,
                damage: typeData.damage,
                size: typeData.size,
                element: enemyElement,
                isPoisoned: false,
                removed: false
            });
        }
    }
    waveTransitioning = false;
}

function doDebuffDamage() {
    if (!playerPaused && !upgradePaused){
    activeEnemies.forEach(enemy => {
        if(enemy.isPoisoned){
        enemy.element.style.filter = 'brightness(2) sepia(1) hue-rotate(285deg) saturate(4000%)'
         setTimeout(() => {
        if (!enemy.removed) {
            enemy.element.style.filter = 'none';
             }
         }, 100);
        enemy.health -= (playerDamage / 2);
        totalDamage += (playerDamage / 2);
        totalDebuffDamage += (playerDamage / 2);
        if (enemy.health <= 0){
            enemiesDefeated += 1;
            enemy.element.remove();
            enemy.removed = true;
                        
            if (enemy.type === 'splitter') {
                for (let i = 0; i < 2; i++) {
                    spawnSplitChild('splitter01', enemy);
                    }
                }
            if (enemy.type === 'splitter01') {
                for (let i = 0; i < 4; i++) {
                    spawnSplitChild('splitter02', enemy);
                    }
                }
            if (enemy.type === 'splitter02') {
                for (let i = 0; i < 8; i++) {
                    spawnSplitChild('splitter03', enemy);
                    }
                }
            }
        }
    }
)}
}

function updateEnemies() {
    activeEnemies.forEach(enemy => {
        if (enemy.removed) return;
        let deltaX = myHoriz - enemy.x;
        let deltaY = myVerti - enemy.y;
        let distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        let minEnemyX = 0 + enemy.size;
        let maxEnemyX = 1050 - enemy.size;
        let minEnemyY = 0 + enemy.size;
        let maxEnemyY = 900 - enemy.size;
        
        if (distance > 1) {
            enemy.x += (deltaX / distance) * enemy.speed;
            enemy.y += (deltaY / distance) * enemy.speed;
            enemy.element.style.left = enemy.x + 'px';
            enemy.element.style.top = enemy.y + 'px';
        }
        if (enemy.x < minEnemyX) {enemy.x = minEnemyX;}
        if (enemy.x > maxEnemyX) {enemy.x = maxEnemyX;}
        if (enemy.y < minEnemyY) {enemy.y = minEnemyY;}
        if (enemy.y > maxEnemyY) {enemy.y = maxEnemyY;} 
        
    });

    if (activeEnemies.length === 0 && gameRunning && !waveTransitioning) {
        waveTransitioning = true;
        currentWaveIndex++;
        
        if (currentWaveIndex % 5 === 0) {
            triggerUpgradesMenu();
        } else if (currentWaveIndex < waveConfigurations.length) {
            setTimeout(() => spawnWave(currentWaveIndex), 1000);
        } else {
            gameRunning = false;
        }
    }
}

function clearEnemies(){
    activeEnemies.forEach(enemy => {
        enemy.element.remove();
        enemy.removed = true;
    });
    activeEnemies = [];
}

function startGame() {
    if (gameRunning) return;
    gameRunning = true;
    currentWaveIndex = 0;
    waveTransitioning = false;
    setInterval(movement, 10);
    setInterval(doDebuffDamage, 1000);
    document.getElementById('tutorialScreen').style.display = 'none';
    playerElement.style.top = myVerti + 'px';
    playerElement.style.left = myHoriz + 'px';
    spawnWave(currentWaveIndex);
}
</script>
